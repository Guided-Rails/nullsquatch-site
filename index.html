<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Null Squatch</title>
  <meta name="description" content="Walk around, and the app proves where Bigfoot is not.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: "#17472d"
          }
        }
      }
    }
  </script>
</head>
<body class="bg-white text-gray-900 antialiased flex min-h-screen flex-col">
  <header class="border-t-8 border-brand">
    <div class="mx-auto flex w-[min(100vw_-_3rem,80rem)] items-center justify-between py-6">
      <a href="/" class="text-lg font-semibold tracking-tight text-brand">Null Squatch</a>
    </div>
  </header>
  <main class="flex-1 w-full max-w-2xl mx-auto px-6 py-16">
    <section class="relative left-1/2 mb-16 w-[min(100vw_-_3rem,80rem)] -translate-x-1/2">
      <h1 class="max-w-3xl text-4xl font-semibold tracking-tight md:text-5xl">Walk around, and the app proves where Bigfoot is <em>not</em>.</h1>
      <p class="mt-6 max-w-2xl text-lg text-gray-600">
        Every mile you cover shrinks the map of places he could still be hiding.
      </p>
      <a href="mailto:hello@nullsquatch.com" class="mt-8 inline-block rounded-md bg-brand px-4 py-2 text-white hover:bg-brand/90">Get in touch</a>
    </section>
  </main>
  <footer class="border-t-8 border-brand">
    <div class="mx-auto flex w-[min(100vw_-_3rem,80rem)] justify-between gap-6 py-8 text-sm text-gray-600">
      <span>&copy; 2026 Guided Rails, LLC. All rights reserved.</span>
      <nav class="flex gap-6">
        <a href="/privacy" class="hover:text-gray-900">Privacy</a>
      </nav>
    </div>
  </footer>
</body>
</html>
